name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Need full history to get tags

      - name: Set up version
        id: version
        run: |
          # Try multiple methods to extract version for robustness
          if [ -f "module.prop" ]; then
            echo "module.prop found"
            cat module.prop

            # Method 1: awk (original)
            VERSION=$(awk -F= '/^version=/ {print $2}' module.prop 2>/dev/null || echo "")
            if [ -n "$VERSION" ]; then
              echo "Method 1 (awk) succeeded: $VERSION"
            else
              # Method 2: sed
              VERSION=$(sed -n 's/^version=//p' module.prop 2>/dev/null || echo "")
              if [ -n "$VERSION" ]; then
                echo "Method 2 (sed) succeeded: $VERSION"
              else
                # Method 3: grep + cut
                VERSION=$(grep '^version=' module.prop | cut -d= -f2 2>/dev/null || echo "")
                if [ -n "$VERSION" ]; then
                  echo "Method 3 (grep+cut) succeeded: $VERSION"
                else
                  # Method 4: grep + cut + tr to remove CR
                  VERSION=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '\r' 2>/dev/null || echo "")
                  if [ -n "$VERSION" ]; then
                    echo "Method 4 (grep+cut+tr) succeeded: $VERSION"
                  else
                    echo "ERROR: All methods failed to extract version from module.prop"
                    exit 1
                  fi
                fi
              fi
            fi
          else
            echo "ERROR: module.prop not found"
            exit 1
          fi

          # Remove any trailing whitespace or line endings
          VERSION=$(echo "$VERSION" | tr -d '[:space:]')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Extracted version is empty"
            exit 1
          fi

          echo "Final version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Set up git to use the GITHUB_TOKEN for authentication
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.TAG }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag if not exists
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.TAG }}"
          git push origin "${{ steps.version.outputs.TAG }}"

      - name: Prepare module files
        run: |
          rm -rf charge-control-module
          mkdir -p charge-control-module
          cp -r charger-daemon.sh post-fs-data.sh service.sh uninstall.sh charge-control-module/
          cp -r config charge-control-module/
          cp module.prop charge-control-module/
          cp README.md charge-control-module/
          cp LICENSE charge-control-module/
          cp -r system charge-control-module/

      - name: Create zip
        run: |
          cd charge-control-module
          zip -r ../charge-controller-module.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: v${{ steps.version.outputs.version }}
          files: charge-controller-module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}