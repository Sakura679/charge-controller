name: Create Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Need full history to get tags

      - name: Set up version
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag if not exists
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Prepare module files
        run: |
          rm -rf charge-control-module
          mkdir -p charge-control-module
          cp -r charger-daemon.sh post-fs-data.sh service.sh uninstall.sh charge-control-module/
          cp -r config charge-control-module/
          cp module.prop charge-control-module/
          cp README.md charge-control-module/
          cp LICENSE charge-control-module/
          cp -r system charge-control-module/

      - name: Create zip
        run: |
          cd charge-control-module
          zip -r ../charge-controller-module.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Charge Control Module v${{ steps.version.outputs.version }}
          files: charge-controller-module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}