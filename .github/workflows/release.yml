name: Create Release

on:
  push:
    tags:
      - 'v*'   # Trigger on push of tags matching v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Need full history to get the tag

      # If you need to build the zip, add steps here.
      # Assuming charge-control-module.zip is already in the repo at the tag.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: charge-control-module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
